name: Update README with Blog Posts

on:
  issues:
    # 彻底移除 opened，避免与新建 issue 时的 labeled 产生双重触发竞态冲突
    types: [labeled, unlabeled, closed, reopened, deleted, edited]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    # 门控：
    # 1. 手动触发，或当前 issue 带 blog 标签，或刚被剥离 blog 标签；
    # 2. 如果是 edited 事件，仅在标题修改（changes.title != null）时触发，修改正文直接跳过
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        (contains(github.event.issue.labels.*.name, 'blog') || github.event.label.name == 'blog') &&
        (github.event.action != 'edited' || github.event.changes.title != null)
      )
    steps:
      - uses: actions/checkout@v4

      - name: Generate blog list
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'blog',
              state: 'open',
              sort: 'created',
              direction: 'desc',
              per_page: 100,
            });

            let list = '';
            issues.forEach((issue, index) => {
              list += `${index + 1}. [${issue.title}](${issue.html_url})\n`;
            });

            if (list === '') {
              list = '_暂无文章_\n';
            }

            const fs = require('fs');
            const readme = fs.readFileSync('README.md', 'utf8');
            const updated = readme.replace(
              /<!-- BLOG-LIST:START -->[\s\S]*?<!-- BLOG-LIST:END -->/,
              `<!-- BLOG-LIST:START -->\n${list}<!-- BLOG-LIST:END -->`
            );
            fs.writeFileSync('README.md', updated);

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (git add README.md && git commit -m "docs: update blog list" && git pull --rebase && git push)
